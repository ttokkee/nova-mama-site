<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Mama : Télécharger l'app</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Télécharge Nova Mama sur l'App Store ou Google Play.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Lien intelligent nova-mama.com/app (stickers Instagram, QR codes, kit presse) :
    // iOS → App Store, Android → Play Store, sinon → home. Page en noindex.
    (function () {
      var APP_STORE = 'https://apps.apple.com/fr/app/nova-mama-grossesse-ia/id6793239667';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.novamama.app';
      var HOME = 'https://nova-mama.com/';
      var ua = navigator.userAgent || '';
      // iPadOS 13+ se présente comme un Mac : on le rattrape via le tactile.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var target = isIOS ? APP_STORE : isAndroid ? PLAY_STORE : HOME;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="logo">N</div>
      <div class="brand">Nova Mama</div>
    </header>

    <h1>On t'emmène vers l'app 💛</h1>
    <p class="muted">Si rien ne se passe, choisis ton téléphone :</p>

    <p>
      <span class="badges"><a href="https://apps.apple.com/fr/app/nova-mama-grossesse-ia/id6793239667"><img class="apple" src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/fr-fr?size=250x83&amp;releaseDate=1755043200" alt="Télécharger Nova Mama dans l'App Store" loading="lazy"></a><a href="https://play.google.com/store/apps/details?id=com.novamama.app"><img class="google" src="https://upload.wikimedia.org/wikipedia/commons/8/8e/Google_Play_Store_badge_FR.svg" alt="Télécharger Nova Mama sur Google Play" loading="lazy"></a></span>
      <a class="btn secondary" href="https://nova-mama.com/">Découvrir Nova Mama</a>
    </p>
  </div>
</body>
</html>
